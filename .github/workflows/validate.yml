name: Validate portable package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static package validation
        run: python -B -X utf8 tools/lightstory.py validate
      - name: Isolated host tests
        run: python -B -X utf8 -m unittest discover -s tests -v
