<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080f13"><meta name="description" content="LightStory Workflows 产品介绍">
<link rel="icon" href="data:,">
<title>光影故事 · 产品介绍</title>
<style>
:root{color-scheme:dark;--bg:#080f13;--ink:#f4eee2;--gold:#e4b86d;--muted:#b2bec1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1240px;margin:auto;padding:26px 28px 40px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
h1{font:27px Georgia,serif;margin:0}h1 span{color:var(--gold)}a{color:var(--gold);text-underline-offset:4px}a:hover{color:var(--ink)}
.player{overflow:hidden;background:#000;border:1px solid #e4b86d40;border-radius:12px}video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.chapters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chapter{padding:7px 13px;color:var(--muted);background:#10191d;border:1px solid #ffffff26;border-radius:6px;font:inherit;cursor:pointer}
.chapter:hover,.chapter[aria-current="true"]{color:var(--ink);border-color:var(--gold);background:#24332c}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
footer{display:flex;justify-content:space-between;gap:20px;margin-top:20px;color:var(--muted);font-size:13px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.error{padding:12px 16px;color:#ffd4aa;background:#34251b;margin:0}.error[hidden]{display:none}
@media(max-width:600px){main{padding:18px 14px 28px}h1{font-size:23px}header>a{font-size:13px}.chapter{padding:7px 10px;font-size:13px}}
</style></head><body><main>
<header><h1>Light<span>Story</span></h1><a href="https://github.com/yuguo-Jack/lightstory-workflows">项目主页</a></header>
<div class="player">
  <video id="film" controls playsinline preload="metadata" poster="assets/poster.jpg" aria-label="光影故事产品介绍">
    <source src="assets/lightstory-intro.mp4" type="video/mp4">
    <track kind="chapters" src="assets/chapters.vtt" srclang="zh" label="章节">
    <track kind="captions" src="assets/captions.vtt" srclang="zh-CN" label="中文">
    <a href="assets/lightstory-intro.mp4">下载视频</a>
  </video>
  <p id="error" class="error" hidden>视频加载失败，请<a href="assets/lightstory-intro.mp4">直接打开MP4</a>。</p>
</div>
<nav class="chapters" aria-label="视频章节">
  <button class="chapter" data-at="0" aria-current="true">开场</button>
  <button class="chapter" data-at="1.875" aria-current="false">游戏</button>
  <button class="chapter" data-at="6.5625" aria-current="false">视频</button>
  <button class="chapter" data-at="10.3125" aria-current="false">资产</button>
  <button class="chapter" data-at="14.0625" aria-current="false">声音</button>
  <button class="chapter" data-at="17.8125" aria-current="false">使用</button>
  <button class="chapter" data-at="22.5" aria-current="false">场景</button>
  <button class="chapter" data-at="26.25" aria-current="false">结尾</button>
</nav>
<div id="status" class="sr-only" aria-live="polite">点击播放</div>
<footer><span>00:30</span><a href="assets/lightstory-intro.mp4" download>下载视频</a></footer>
</main><script>
const film=document.querySelector('#film'),status=document.querySelector('#status'),chapters=[...document.querySelectorAll('.chapter')];let requested=null;
const seek=time=>{if(film.readyState<1){requested=time;film.load();return}film.currentTime=time;film.play().catch(()=>status.textContent='点击播放器继续播放')};
chapters.forEach(button=>button.addEventListener('click',()=>seek(Number(button.dataset.at))));
film.addEventListener('loadedmetadata',()=>{if(requested!==null){const time=requested;requested=null;seek(time)}});
film.addEventListener('timeupdate',()=>{let active=0;chapters.forEach((b,i)=>{if(Number(b.dataset.at)<=film.currentTime)active=i});chapters.forEach((b,i)=>b.setAttribute('aria-current',String(i===active)))});
const failed=()=>{document.querySelector('#error').hidden=false;status.textContent='加载失败'};
film.addEventListener('error',failed);film.querySelector('source').addEventListener('error',failed);
</script></body></html>
